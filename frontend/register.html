<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register · CodeSense</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="css/style.css">

    <!-- Theme initialization (prevents screen flashing) -->
    <script src="js/theme.js"></script>
</head>

<body>

    <nav class="navbar">
        <a href="index.html" class="logo">
            <span class="logo-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m16 18 6-6-6-6"/>
                    <path d="m8 6-6 6 6 6"/>
                    <circle cx="12" cy="12" r="1.5" fill="currentColor"/>
                </svg>
            </span>
            Code<span>Sense</span>
        </a>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>

            <!-- Theme Toggle Button -->
            <button id="themeToggle" class="theme-toggle-btn" aria-label="Toggle Theme">
                🌙
            </button>
        </div>
    </nav>

    <main class="auth-page">

        <div class="auth-card">

            <div class="auth-header">
                <h1>Create your account</h1>
                <p>
                    Start decoding logic and understanding your codebase with CodeSense.
                </p>
            </div>

            <form id="registerForm">

                <div class="form-group">
                    <label for="username">Username</label>
                    <input
                        type="text"
                        id="username"
                        placeholder="Enter username"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="passcode">Password</label>
                    <input
                        type="password"
                        id="passcode"
                        placeholder="Enter password"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="dob">Date of Birth</label>
                    <input
                        type="date"
                        id="dob"
                        required
                    >
                </div>

                <button type="submit" class="auth-button">
                    Create Account
                </button>

            </form>

            <p id="registerMessage" class="auth-message"></p>

            <div class="auth-footer">
                Already have an account?
                <a href="login.html">Sign in</a>
            </div>

        </div>

    </main>

    <script src="js/auth.js"></script>

</body>
</html>
